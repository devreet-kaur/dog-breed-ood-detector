# .github/workflows/ci.yml
# GitHub Actions CI pipeline for dog-breed-ood-detector
# Owner: Devreet
#
# Triggers on every push and PR to develop and main.
# Jobs:
#   1. lint    -- ruff check
#   2. test    -- pytest (all pipeline + OOD tests, plus API tests)
#   3. docker  -- docker build smoke test
#   4. smoke   -- curl /health inside the container

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff
        run: ruff check src/ tests/ --no-cache

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU
        run: |
          pip install torch==2.13.0 torchvision==0.28.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline tests
        run: python -m pytest tests/test_prepare.py tests/test_pipeline.py tests/test_ood_entropy.py tests/test_ood_binary.py tests/test_ood_compare.py -v --tb=short

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v --tb=short

      - name: Smoke test monitor.py imports cleanly
        run: python -c "import sys; sys.path.insert(0, 'src'); import monitor; print('monitor.py imports OK')"

  # ── Job 3: Docker build ─────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t mai202-dog-ood:ci .

      - name: Smoke test -- /health endpoint
        run: |
          # No checkpoint is mounted in this job, so /health should report the
          # honest degraded state and a 503, not a fallback "ok".
          docker run -d --name mai202-ci -p 8000:8000 mai202-dog-ood:ci
          sleep 15
          code=$(curl --retry 5 --retry-delay 3 --retry-connrefused \
            -s -o response.json -w "%{http_code}" \
            http://localhost:8000/health)
          python3 -c "
          import json
          with open('response.json') as f:
              data = json.load(f)
          assert '$code' == '503', f'Expected 503 got $code, body={data}'
          assert data['status'] == 'degraded', f'Expected degraded got {data}'
          assert data['model'] is None, f'Expected model=None got {data}'
          print('Smoke test passed (no checkpoint mounted, service correctly reports degraded):', data)
          "
          docker stop mai202-ci
