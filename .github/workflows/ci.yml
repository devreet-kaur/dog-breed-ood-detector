# .github/workflows/ci.yml
# GitHub Actions CI pipeline for dog-breed-ood-detector
# Owner: Devreet
#
# Triggers on every push and PR to develop and main.
# Jobs:
#   1. lint    -- ruff check
#   2. test    -- pytest (all pipeline + OOD tests, plus API tests)
#   3. docker  -- docker build smoke test
#   4. smoke   -- curl /health inside the container

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff
        run: ruff check src/ tests/ --no-cache

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU
        run: |
          pip install torch==2.13.0 torchvision==0.28.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline tests
        run: python -m pytest tests/test_prepare.py tests/test_pipeline.py tests/test_ood_entropy.py tests/test_ood_binary.py tests/test_ood_compare.py -v --tb=short

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v --tb=short

  # ── Job 3: Docker build ─────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t mai202-dog-ood:ci .

      - name: Smoke test -- /health endpoint
        run: |
          docker run -d --name mai202-ci -p 8000:8000 mai202-dog-ood:ci
          sleep 15
          curl --retry 5 --retry-delay 3 --retry-connrefused \
            http://localhost:8000/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Expected ok got {data}'
          assert data['model'] == 'resnet18', f'Expected resnet18 got {data}'
          assert data['classes'] == 120, f'Expected 120 got {data}'
          print('Smoke test passed:', data)
          "
          docker stop mai202-ci
