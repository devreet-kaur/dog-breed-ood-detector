stages:
  # Raw Stanford Dogs is a pipeline *input*, not a stage output -- it is tracked
  # separately with `dvc add data/raw/stanford_dogs`. A fresh clone does:
  #     dvc pull            # brings down raw + processed
  #     dvc repro prepare   # no-op if nothing changed, deterministic if it runs
  prepare:
    desc: Crop Stanford Dogs to their bounding boxes and split 70/15/15 per breed.
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw/stanford_dogs/Images
      - data/raw/stanford_dogs/Annotation
    # params.yaml is deliberately NOT in deps. Listing the whole file there
    # would re-run this six-minute stage whenever anyone touched train_head,
    # ood_binary, etc. The params block below is precise: only the `data`
    # section invalidates prepare.
    params:
      - params.yaml:
          - data
    outs:
      - data/processed/train
      - data/processed/val
      - data/processed/test
    metrics:
      - reports/split_summary.json:
          cache: false

  train:
    cmd: python src/train.py --stage head && python src/train.py --stage finetune
    deps:
      - src/train.py
      - data/processed/train/
      - params.yaml
    params:
      - params.yaml:
          - data
          - train_head
          - train_finetune
    outs:
      - models/resnet18_best.pt
    metrics:
      - reports/metrics_train.json:
          cache: false

  calibrate:
    cmd: python src/calibrate.py
    deps:
      - src/calibrate.py
      - models/resnet18_best.pt
      - data/processed/val
    params:
      - params.yaml:
          - data
          - train_head
    metrics:
      - models/temperature.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/resnet18_best.pt
      - data/processed/train/
      - params.yaml
    params:
      - params.yaml:
          - data
          - train_head
          - train_finetune
    metrics:
      - reports/metrics_test.json:
          cache: false
    plots:
      - reports/plots/confusion_matrix.png:
          cache: false

  ood_entropy:
    cmd: python src/ood_entropy.py --num-workers 0
    deps:
      - src/ood_entropy.py
      - src/evaluate.py
      - models/resnet18_best.pt
      - data/processed/val
      - data/processed/test
      - data/raw/ood/test
    params:
      - params.yaml:
          - data
          - train_head
          - ood_entropy
    metrics:
      - reports/ood/strategy_a_metrics.json:
          cache: false
    outs:
      - reports/ood/entropy_threshold.json:
          cache: false
      - reports/ood/strategy_a_test_scores.npz:
          cache: false
    plots:
      - reports/ood/entropy_distribution.png:
          cache: false

  ood_binary:
    cmd: python src/ood_binary.py
    deps:
      - src/ood_binary.py
      - data/processed/train
      - data/processed/val
      - data/raw/ood/val
    params:
      - params.yaml:
          - data
          - ood_binary
          - ood_entropy
    outs:
      - models/binary_cnn.pt
    metrics:
      - reports/ood/strategy_b_validation_metrics.json:
          cache: false
    plots:
      - reports/ood/binary_training_history.png:
          cache: false
  
  ood_binary_evaluate:
    cmd: python src/ood_binary.py --evaluate-only --num-workers 0
    deps:
      - src/ood_binary.py
      - models/binary_cnn.pt
      - data/processed/test
      - data/raw/ood/test
    params:
      - params.yaml:
          - data
          - ood_binary
          - ood_entropy
    metrics:
      - reports/ood/strategy_b_test_metrics.json:
          cache: false
    outs:
      - reports/ood/strategy_b_test_scores.npz:
          cache: false


  ood_compare:
    cmd: python src/ood_compare.py
    deps:
      - src/ood_compare.py
      - reports/ood/strategy_a_metrics.json
      - reports/ood/strategy_b_test_metrics.json
      - reports/ood/strategy_a_test_scores.npz
      - reports/ood/strategy_b_test_scores.npz
    metrics:
      - reports/ood/strategy_comparison.json:
          cache: false
    plots:
      - reports/ood/strategy_comparison.png:
          cache: false
      - reports/ood/reliability_comparison.png:
          cache: false
    outs:
      - reports/ood/strategy_comparison.csv:
          cache: false
      - reports/ood/comparison_summary.txt:
          cache: false